version: '3.8'

services:
  notification-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: notification-engine
    ports:
      - "8037:8037"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/notifications
      - REDIS_URL=redis://redis:6379
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM:-notifications@company.com}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_DEFAULT_CHANNEL=${SLACK_DEFAULT_CHANNEL:-#alerts}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-100}
      - ESCALATION_HOURS=${ESCALATION_HOURS:-24}
      - DIGEST_ENABLED=${DIGEST_ENABLED:-true}
      - DIGEST_INTERVAL_HOURS=${DIGEST_INTERVAL_HOURS:-6}
      - DEBUG=${DEBUG:-false}
      - GLOBAL_STATE_MANAGER_URL=http://global-state-manager:8035
      - GOVERNANCE_ENGINE_URL=http://governance-engine:8033
    depends_on:
      - postgres
      - redis
    networks:
      - notification-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: notification-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notifications
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - notification-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    networks:
      - notification-network
    restart: unless-stopped

networks:
  notification-network:
    driver: bridge

volumes:
  postgres-data:
