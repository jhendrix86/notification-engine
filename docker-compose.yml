version: '3.8'

services:
  notification-engine:
    build: .
    container_name: notification-engine
    ports:
      - "8045:8045"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/notification}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DEBUG=${DEBUG:-false}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    networks:
      - os42

  postgres:
    image: postgres:15-alpine
    container_name: notification-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notification
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    networks:
      - os42

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    networks:
      - os42

volumes:
  notification-postgres-data:

networks:
  os42:
    driver: bridge
